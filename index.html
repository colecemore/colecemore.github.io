<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monopoly (browser only)</title>
<style>
:root{--ink:#10243a;--paper:#e3efe6;--line:#2c4a3d;--gold:#f0b429}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#f3f6f4;font:15px/1.4 "Trebuchet MS",system-ui,sans-serif}
input,button{font:inherit;padding:10px 12px;border-radius:6px;border:0}
input{width:100%;margin:6px 0;background:#1b3552;color:#fff}
button{background:var(--gold);color:#201600;font-weight:700;cursor:pointer}

button:focus-visible,input:focus-visible{outline:3px solid #fff}
.lobby{max-width:420px;margin:10vh auto;padding:24px}
h1{font:700 48px/1 Georgia,serif;letter-spacing:-1px;margin:0 0 20px}
.code{font:700 56px/1 Georgia,serif;letter-spacing:8px;color:var(--gold);margin:8px 0}
.game{display:flex;gap:16px;padding:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center}

.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1b3552;border-radius:8px;border-left:6px solid}
.pl.now{outline:2px solid var(--gold)}.pl.out{opacity:.4;text-decoration:line-through}.pl b{margin-left:auto}
.pp{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}.pp span{width:10px;height:10px;border-radius:2px}.pp em{flex:1;font-style:normal}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#b3261e;padding:10px 16px;border-radius:8px;display:none}
.game{--b:min(94vh,96vw,780px)}
.board{position:relative;transform-origin:0 0;transition:transform .7s ease;--c:calc(var(--b)*.14);--s:calc(var(--b)*.08);width:var(--b);height:var(--b);display:grid;grid-template-columns:var(--c) repeat(9,1fr) var(--c);grid-template-rows:var(--c) repeat(9,1fr) var(--c);background:#000;gap:1px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.sq{background:#cde6d0;color:#000;position:relative;overflow:hidden}
.in{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:calc(var(--b)*.0098);font-weight:700;line-height:1.05}
.k-b .in,.k-c .in,.k-t .in{inset:0}.k-t .in{transform:rotate(180deg)}
.k-l .in,.k-r .in{width:var(--s);height:var(--c);left:calc(50% - var(--s)/2);top:calc(50% - var(--c)/2)}
.k-l .in{transform:rotate(90deg)}.k-r .in{transform:rotate(-90deg)}
.bar{width:100%;height:22%;border-bottom:1px solid #000;flex:none}
.nm{flex:1;display:flex;align-items:center;justify-content:center;padding:0 2px;text-transform:uppercase}
.ic{font-size:2.3em;line-height:1;flex:none;margin-bottom:2px}.pr{flex:none;padding-bottom:3px;font-weight:600}
.cn{justify-content:center;gap:2px}.cn b{font:900 2.6em/1 "Arial Black",Impact,sans-serif;text-transform:uppercase}.cn small{font-size:.8em}
.go{color:#e30613}.sq.m .in{opacity:.4}.own{position:absolute;left:0;right:0;bottom:0;height:5px}
.tk{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;pointer-events:none;padding:8%}
.k-c .tk{align-items:flex-end;padding-bottom:5%}.tk i{width:calc(var(--b)*.027);height:calc(var(--b)*.027);border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000,0 2px 3px #0008}
.mid{grid-area:2/2/11/11;background:#cde6d0;position:relative;overflow:hidden;color:#111}
.ban{position:absolute;left:50%;top:33%;width:100%;transform:translate(-50%,-50%) rotate(-30deg);background:#e30613;color:#fff;border:3px solid #000;text-align:center;padding:.05em 0;font:900 calc(var(--b)*.062)/1.1 "Arial Black",Impact,sans-serif;letter-spacing:.03em}
.deck{position:absolute;width:27%;height:15%;border:2px solid #000;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 calc(var(--b)*.017) "Arial Black",Arial,sans-serif;text-align:center;transform:rotate(45deg)}
.deck b{font-size:2.6em;line-height:1}.ch{background:#f58220;right:3%;top:37%;width:25%;height:14%}.cc{background:#4aa7dd;left:4%;top:6%;width:25%;height:14%}
.ctl{position:absolute;left:4%;right:4%;top:60%;bottom:3%;background:#fff;border:2px solid #000;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between}.hd{font:700 20px Georgia,serif}.dice{font-size:38px;line-height:1;color:#111}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stage{width:var(--b);height:var(--b);overflow:hidden;position:relative;background:#000;outline:3px solid #000;flex:none}
.tl{position:absolute;inset:0;pointer-events:none;z-index:3}
.tok{position:absolute;width:calc(var(--b)*.032);height:calc(var(--b)*.032);margin:calc(var(--b)*-.016) 0 0 calc(var(--b)*-.016);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #000,0 3px 5px #0009;transition:left .17s linear,top .17s linear;display:flex;align-items:center;justify-content:center;font:700 calc(var(--b)*.014) Arial;color:#fff;text-shadow:0 1px 2px #000}
.tok.now{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px #ffd54a,0 3px 5px #0009}}
.hud{position:absolute;left:3%;right:3%;bottom:2%;z-index:6;background:#fffffff2;color:#111;border:2px solid #000;border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:6px}
.hud .hd{font:700 17px Georgia,serif}.hud .dice{display:flex}
.die{width:38px;height:38px;background:#fff;border:2px solid #111;border-radius:7px;display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px;margin-left:6px;box-shadow:0 2px 0 #0003}
.die i{border-radius:50%;margin:1px}.die i.on{background:#111}
.roll .die{animation:shake .16s infinite alternate}@keyframes shake{from{transform:rotate(-14deg) translateY(-4px)}to{transform:rotate(14deg) translateY(2px)}}
aside{width:300px}aside .log{max-height:190px;overflow:auto;background:#1b3552;border-radius:8px;padding:8px;color:#dfe9f2}aside .log div{border-color:#ffffff18}
.pl.foc{outline:2px dashed #fff}.hint{font-size:13px;color:#ffd54a;margin:4px 0}.tr{background:#2b4a6b;border-radius:8px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
select{background:#1b3552;color:#fff;border:0;border-radius:6px;padding:6px;font:inherit}.set{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}.set label{display:flex;justify-content:space-between;align-items:center}
.ck input{width:auto;margin:0 6px 0 0}.ck{justify-content:flex-start!important}h3{margin:14px 0 6px}
.modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:50}
.mbox{background:#fff;color:#111;border-radius:10px;padding:18px;min-width:340px;max-width:92vw;max-height:88vh;overflow:auto}
.mbox select{background:#eee;color:#111}.cols{display:flex;gap:24px;margin:12px 0}.cols label{display:block;font-size:13px;margin:3px 0}
.mbox input[type=number]{width:90px;background:#eee;color:#111;padding:4px;margin:0}.mbox input[type=checkbox]{width:auto;margin:0 4px 0 0}
.popup{position:absolute;left:50%;top:5%;z-index:8;width:min(250px,60%);background:#fff;color:#111;border:3px solid #000;border-radius:6px;text-align:center;box-shadow:0 12px 30px #000b;cursor:pointer;animation:pop .4s ease-out both;transform:translateX(-50%)}
@keyframes pop{from{transform:translateX(-50%) rotateY(90deg) scale(.6);opacity:0}to{transform:translateX(-50%) rotateY(0) scale(1);opacity:1}}
.popup .cap{font-size:12px;padding:5px;background:#eee;border-bottom:1px solid #000}.dh,.cd{padding:8px 6px;display:flex;flex-direction:column;border-bottom:3px solid #000}
.dh b{font:900 17px/1.1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.5px}.dh small,.cd small{font-size:10px;letter-spacing:2px}
.cd{padding:10px}.cd small{font-weight:700}.cd .big{font:900 44px/1 Georgia,serif;color:#fff}.popup .db{padding:8px 10px;font-size:13px;line-height:1.5}.popup .db div{display:flex;justify-content:space-between}
.popup .cd+.db div{display:block}.popup .ow{padding:6px;font-size:12px;border-top:1px solid #0003;background:#f4f4f4}
.feed{position:absolute;left:8px;top:8px;width:min(250px,32%);z-index:7;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.fi{background:#10243af2;color:#fff;border-left:5px solid;border-radius:6px;padding:5px 8px;font-size:12.5px;line-height:1.25;box-shadow:0 3px 8px #0006;animation:fin .3s ease-out,fout .5s 6s forwards}
@keyframes fin{from{transform:translateX(-30px);opacity:0}}@keyframes fout{to{opacity:0}}
.bar{display:flex;align-items:center;justify-content:center}.bar i{display:block;border:1px solid #000}.bar i.hs{width:.75em;height:.75em;background:#1fb25a;margin:0 1px}.bar i.ht{width:1.8em;height:.85em;background:#e30613}
.sq[data-u=deed]{cursor:help}.pp{flex-wrap:wrap}.pp button.sm{padding:2px 7px}
.hud{pointer-events:none}.hud button{pointer-events:auto}
.hud.center{top:58%;bottom:auto;left:17%;right:17%;box-shadow:0 6px 18px #0006}
.tmr{position:relative;height:17px;background:#ddd;border:1px solid #000;border-radius:9px;overflow:hidden;visibility:hidden}
.tmr i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .25s linear}.tmr span{position:relative;font:700 11px/15px Arial;padding:0 8px;color:#000}
html{-webkit-text-size-adjust:100%}button{touch-action:manipulation}
@supports (height:100dvh){.game{--b:min(94dvh,96vw,780px)}}
@media (max-width:900px){.game{padding:6px;gap:10px;justify-content:center}aside{width:min(96vw,560px)}}
@media (max-width:700px){input,select{font-size:16px}button{padding:12px 14px}button.sm{padding:8px 10px;font-size:13px}.hud{padding:5px 8px;gap:4px}.hud .hd{font-size:15px}
.die{width:30px;height:30px;padding:3px;margin-left:4px}.feed{width:52%}.fi{font-size:11px;padding:4px 6px}.lobby{margin:3vh auto;padding:14px}h1{font-size:38px}.code{font-size:44px}
.cols{flex-wrap:wrap}.mbox{min-width:0;width:94vw}.popup{width:min(230px,68%)}.pl{padding:6px 8px}.hud .row{gap:6px}}
@media (max-width:700px){.hud button{padding:8px 11px;font-size:13px}.hud .hd{font-size:14px}.popup{width:min(210px,62%);top:3%}
.popup .db{font-size:10.5px!important;line-height:1.25!important;padding:5px 8px}.popup .cap{font-size:10px;padding:3px}.dh b{font-size:14px}.dh{padding:5px 4px}.cd{padding:6px}.cd .big{font-size:30px}.popup .ow{font-size:10px;padding:3px}}
@media (hover:none){.keys{display:none}}

<script>
(function (g) {
  const p = (n, c, p, r) => ({ t: 'p', n, c, p, r }), rr = n => ({ t: 'r', n, p: 200 }), uu = n => ({ t: 'u', n, p: 150 }),
    cc = n => ({ t: 'c', n }), tx = (n, a) => ({ t: 'x', n, a });
  const B = [{ t: 'go', n: 'GO' }, p('Mediter\u00adranean Ave', '#955436', 60, 2), cc('Community Chest'), p('Baltic Ave', '#955436', 60, 4), tx('Income Tax', 200), rr('Reading Railroad'),
    p('Oriental Ave', '#aae0fa', 100, 6), cc('Chance'), p('Vermont Ave', '#aae0fa', 100, 6), p('Connecticut Ave', '#aae0fa', 120, 8), { t: 'jail', n: 'Jail' },
    p('St. Charles Pl', '#d93a96', 140, 10), uu('Electric Co.'), p('States Ave', '#d93a96', 140, 10), p('Virginia Ave', '#d93a96', 160, 12), rr('Pennsyl\u00advania RR'),
    p('St. James Pl', '#f7941d', 180, 14), cc('Community Chest'), p('Tennessee Ave', '#f7941d', 180, 14), p('New York Ave', '#f7941d', 200, 16), { t: 'free', n: 'Free Parking' },
    p('Kentucky Ave', '#ed1b24', 220, 18), cc('Chance'), p('Indiana Ave', '#ed1b24', 220, 18), p('Illinois Ave', '#ed1b24', 240, 20), rr('B&O Railroad'),
    p('Atlantic Ave', '#fef200', 260, 22), p('Ventnor Ave', '#fef200', 260, 22), uu('Water Works'), p('Marvin Gardens', '#fef200', 280, 24), { t: 'gtj', n: 'Go To Jail' },
    p('Pacific Ave', '#1fb25a', 300, 26), p('N. Carolina Ave', '#1fb25a', 300, 26), cc('Community Chest'), p('Pennsyl\u00advania Ave', '#1fb25a', 320, 28), rr('Short Line'),
    cc('Chance'), p('Park Place', '#0072bb', 350, 35), tx('Luxury Tax', 100), p('Boardwalk', '#0072bb', 400, 50)];
  // [text, kind, value]  m=money g=advance-to j=jail b=back 3 f=jail card a=collect from all e=pay each
  const CARDS = [['Bank error in your favor. Collect $100', 'm', 100], ['Doctor fees. Pay $50', 'm', -50], ['Advance to GO', 'g', 0], ['Go directly to Jail', 'j'],
    ['Go back 3 spaces', 'b'], ['Advance to Boardwalk', 'g', 39], ['Get Out of Jail Free', 'f'], ["It's your birthday. Collect $20 from every player", 'a', 20],
    ['Pay each player $25', 'e', 25], ['Advance to Illinois Ave', 'g', 24], ['Speeding fine. Pay $15', 'm', -15], ['Building loan matures. Collect $150', 'm', 150]];
  const RT = { 1: [2, 10, 30, 90, 160, 250], 3: [4, 20, 60, 180, 320, 450], 6: [6, 30, 90, 270, 400, 550], 8: [6, 30, 90, 270, 400, 550], 9: [8, 40, 100, 300, 450, 600],
    11: [10, 50, 150, 450, 625, 750], 13: [10, 50, 150, 450, 625, 750], 14: [12, 60, 180, 500, 700, 900], 16: [14, 70, 200, 550, 750, 950], 18: [14, 70, 200, 550, 750, 950], 19: [16, 80, 220, 600, 800, 1000],
    21: [18, 90, 250, 700, 875, 1050], 23: [18, 90, 250, 700, 875, 1050], 24: [20, 100, 300, 750, 925, 1100], 26: [22, 110, 330, 800, 975, 1150], 27: [22, 110, 330, 800, 975, 1150], 29: [24, 120, 360, 850, 1025, 1200],
    31: [26, 130, 390, 900, 1100, 1275], 32: [26, 130, 390, 900, 1100, 1275], 34: [28, 150, 450, 1000, 1200, 1400], 37: [35, 175, 500, 1100, 1300, 1500], 39: [50, 200, 600, 1400, 1700, 2000] };
  B.forEach((s, i) => { if (s.t === 'p') { s.rt = RT[i]; s.h = i < 10 ? 50 : i < 20 ? 100 : i < 30 ? 150 : 200; } });
  g.B = B; g.CARDS = CARDS;
})(window);

const COL = ['#e4572e', '#2e86ab', '#f2b134', '#3bb273', '#9b5de5', '#ef476f'];
const rnd = n => 1 + Math.floor(Math.random() * n), uid = () => Math.random().toString(36).slice(2, 10);
const grp = i => B[i].c ? B.map((q, j) => j).filter(j => B[j].c === B[i].c) : [i];
const cur = r => r.players[r.turn], by = (r, id) => r.players.find(p => p.id === id);
const say = (r, m) => { r.log.push(m); r.logN = (r.logN || 0) + 1; if (r.log.length > 80) r.log.shift(); };

function view(r) {
  return { code: r.code, host: r.host, players: r.players.map(({ key, ...p }) => p), own: r.own, mort: r.mort, turn: r.turn,
    phase: r.phase, dice: r.dice, log: r.log, debt: r.debt, winner: r.winner,
    auc: r.auc, trade: r.trade, hs: r.hs, dl: r.dl ? { t: r.dl.t, s: r.dl.s, id: r.dl.id } : null, ev: r.ev, cardEv: r.cardEv, logN: r.logN || 0, set: r.set, pot: r.pot, rolls: r.rolls || 0 };
}
function addPlayer(r, name) {
  const p = { id: 'p' + r.players.length, key: uid() + uid(), name: String(name || 'Player').slice(0, 16) || 'Player', color: COL[r.players.length],
    money: 1500, pos: 0, jail: false, jt: 0, jf: 0, out: false, afk: 0 };
  r.players.push(p); return p;
}
function owe(r, p, amt, to) {
  if (p.money >= amt) { p.money -= amt; if (to) to.money += amt; return true; }
  r.debt = { id: p.id, amt, to: to ? to.id : null }; r.phase = 'debt';
  say(r, `${p.name} owes $${amt} — mortgage a property or go bankrupt.`); return false;
}
const after = r => { r.phase = (r.dbl && !cur(r).jail) ? 'roll' : 'end'; };
function startAuction(r, p) {
  const n = r.players.length, left = [];
  for (let k = 1; k <= n; k++) { const q = r.players[(r.turn + k) % n]; if (!q.out) left.push(q.id); }
  r.auc = { i: p.pos, bid: 0, hi: null, left, at: 0 }; r.phase = 'auction'; say(r, `Auction for ${B[p.pos].n}!`);
}
function next(r) {
  r.tn = (r.tn || 0) + 1; do r.turn = (r.turn + 1) % r.players.length; while (cur(r).out); r.dbl = 0; r.phase = 'roll'; }
function jail(r, p) { p.pos = 10; p.jail = true; p.jt = 0; r.dbl = 0; say(r, `${p.name} goes to jail.`); }
function moveTo(r, p, i) { if (i < p.pos) { p.money += r.set.salary; say(r, `${p.name} passes GO (+$${r.set.salary}).`); } p.pos = i; }

function card(r, p) {
  const [t, k, v] = CARDS[rnd(CARDS.length) - 1]; say(r, `Card: ${t}`); r.cardEv = { n: (r.cardEv ? r.cardEv.n : 0) + 1, kind: B[p.pos].n, text: t, who: p.id };
  if (k === 'm') { v < 0 ? owe(r, p, -v, null) : (p.money += v); }
  else if (k === 'g') { moveTo(r, p, v); land(r, p); }
  else if (k === 'j') jail(r, p);
  else if (k === 'b') { p.pos = (p.pos + 37) % 40; land(r, p); }
  else if (k === 'f') p.jf++;
  else if (k === 'a') r.players.forEach(o => { if (o !== p && !o.out) { const a = Math.min(v, o.money); o.money -= a; p.money += a; } });
  else if (k === 'e') {
    const n = r.players.filter(o => o !== p && !o.out);
    if (p.money >= v * n.length) n.forEach(o => { p.money -= v; o.money += v; }); else owe(r, p, v * n.length, null);
  }
}
function land(r, p) {
  const s = B[p.pos]; say(r, `${p.name} landed on ${s.n}.`);
  if ('pru'.includes(s.t)) {
    r.ev = { n: (r.ev ? r.ev.n : 0) + 1, i: p.pos, who: p.id };
    const o = r.own[p.pos];
    if (!o) { r.phase = 'buy'; return; }
    if (o !== p.id && !r.mort[p.pos]) {
      let rent;
      if (s.t === 'p') { const n = r.hs[p.pos] || 0; rent = n ? s.rt[n] : s.r * (B.every((q, i) => q.c !== s.c || r.own[i] === o) ? 2 : 1); }
      else if (s.t === 'r') rent = 25 << (B.filter((q, i) => q.t === 'r' && r.own[i] === o).length - 1);
      else rent = (r.dice[0] + r.dice[1]) * (B.filter((q, i) => q.t === 'u' && r.own[i] === o).length > 1 ? 10 : 4);
      const ow = by(r, o); say(r, `${p.name} pays $${rent} rent to ${ow.name}.`); owe(r, p, rent, ow);
    }
  } else if (s.t === 'x') { if (owe(r, p, s.a, null) && r.set.jackpot) r.pot += s.a; }
  else if (s.t === 'gtj') jail(r, p);
  else if (s.t === 'c') card(r, p);
  else if (s.t === 'free' && r.set.jackpot && r.pot) { say(r, `${p.name} wins the $${r.pot} Free Parking jackpot!`); p.money += r.pot; r.pot = 0; }
}

function act(r, p, a) {
  const ph = r.phase;
  if (ph === 'lobby') return 'Game has not started';
  if (ph === 'over') return 'Game is over';
  switch (a.type) {
    case 'chat': say(r, `${p.name}: ${String(a.text || '').slice(0, 140)}`); return;
    case 'mortgage': {
      const s = B[a.i]; if (!s || r.own[a.i] !== p.id || r.mort[a.i]) return 'Not allowed';
      if (grp(a.i).some(j => (r.hs[j] || 0) > 0)) return 'Sell the houses in this color group first';
      r.mort[a.i] = true; p.money += s.p / 2; say(r, `${p.name} mortgaged ${s.n} (+$${s.p / 2}).`); return;
    }
    case 'sellHouse': {
      const s = B[a.i]; if (!s || s.t !== 'p' || r.own[a.i] !== p.id || !(r.hs[a.i] > 0)) return 'No house to sell';
      if (r.hs[a.i] < Math.max(...grp(a.i).map(j => r.hs[j] || 0))) return 'Sell evenly across the color group';
      r.hs[a.i]--; p.money += s.h / 2; say(r, `${p.name} sold a ${r.hs[a.i] === 4 ? 'hotel' : 'house'} on ${s.n} (+$${s.h / 2}).`); return;
    }
    case 'unmortgage': {
      const s = B[a.i]; if (!s || r.own[a.i] !== p.id || !r.mort[a.i]) return 'Not allowed';
      const c = Math.ceil(s.p / 2 * 1.1); if (p.money < c) return 'Not enough cash';
      p.money -= c; delete r.mort[a.i]; say(r, `${p.name} unmortgaged ${s.n} (-$${c}).`); return;
    }
  }
  if (a.type === 'bid' || a.type === 'fold') {
    if (ph !== 'auction') return 'No auction running';
    const u = r.auc; if (u.left[u.at] !== p.id) return 'Not your turn to bid';

  $('#pl').innerHTML = S.players.map((p, i) => `<div class="pl${i === S.turn && !S.winner ? ' now' : ''}${p.out ? ' out' : ''}${focus === p.id ? ' foc' : ''}" data-u=focus data-id=${p.id} style="border-color:${p.color};margin-bottom:6px;cursor:pointer" title="Click to zoom to this player">${p.bot ? '🤖 ' : ''}${esc(p.name)}${p.id === ses.id ? ' (you)' : ''}${p.jail ? ' ⛓️' : ''}${p.jf ? ' 🎟️' : ''}${p.afk ? ` <span title="Missed turns in a row. 6 means removal" style="color:#ffb4a9">⏰${p.afk}/6</span>` : ''}<small style="opacity:.7;margin-left:6px" title="Cash + property + buildings">net $${worth(p)}</small><b>$${p.money}</b></div>`).join('') + (S.set.jackpot ? `<div class=hint>Free Parking jackpot: $${S.pot}</div>` : '');
  const d = x => [x.cash ? '$' + x.cash : '', ...x.props.map(i => B[i].n)].filter(Boolean).join(', ') || 'nothing';
  $('#tr').innerHTML = S.trade ? `<div class=tr><b>Trade offer</b><div>${nm(S.trade.from)} gives: ${d(S.trade.give)}</div><div>${nm(S.trade.to)} gives: ${d(S.trade.get)}</div>${S.trade.to === ses.id ? '<div class=row><button data-a=tAccept>Accept</button><button class=alt data-a=tDecline>Decline</button></div>' : S.trade.from === ses.id ? '<div><button class="alt sm" data-a=tDecline>Cancel offer</button></div>' : ''}</div>` : '';
  $('#zb').textContent = zoomOn ? '🔍 Auto-zoom: on' : '🔍 Auto-zoom: off';
  const mine = Object.keys(S.own).map(Number).filter(i => S.own[i] === ses.id).sort((x, y) => x - y), hs = i => (S.hs || {})[i] || 0;
  const gi = i => B[i].c ? B.map((q, j) => j).filter(j => B[j].c === B[i].c) : [i];
  $('#pp').innerHTML = mine.length ? '<b>Your properties</b>' + mine.map(i => {
    const s = B[i], m = S.mort[i], mono = s.c && gi(i).every(j => S.own[j] === ses.id), n = hs(i), any = gi(i).some(j => hs(j));
    const bld = s.t === 'p' && mono && !m ? `<button class="sm" data-a=build data-i=${i} title="Build for $${s.h}">＋$${s.h}</button><button class="sm alt" data-a=sellHouse data-i=${i} ${n ? '' : 'disabled'} title="Sell for $${s.h / 2}">－</button>` : '';
    return `<div class=pp><span style="background:${s.c || '#888'}"></span><em>${s.n}${m ? ' (mortgaged)' : ''}${n ? ' · ' + (n === 5 ? '🏨' : '🏠'.repeat(n)) : ''}</em>${bld}<button class="sm alt" data-a="${m ? 'unmortgage' : 'mortgage'}" data-i=${i} ${any && !m ? 'disabled' : ''}>${m ? 'Unmortgage $' + Math.ceil(s.p / 2 * 1.1) : 'Mortgage +$' + s.p / 2}</button></div>`; }).join('') : '';
  $('#log').innerHTML = S.log.slice(-30).reverse().map(l => `<div>${esc(l)}</div>`).join('');
}
function hud() {
  if (!S || S.phase === 'lobby' || !$('#hd')) return;
  const p = S.players[S.turn], mine = p.id === ses.id, ph = S.phase, me = who(ses.id), nm = id => esc(who(id).name); let acts = '', hd;
  if (S.winner) { hd = nm(S.winner) + ' wins! 🏆'; acts = (ses.host ? '<button data-u=rematch>Play again</button>' : '') + '<button class=alt data-u=menu>Menu</button>'; }
  else if (ph === 'auction') {
    const u = S.auc, a = u.left[u.at]; hd = `Auction: ${B[u.i].n} · bid $${u.bid}${u.hi ? ' (' + nm(u.hi) + ')' : ''}`;
    if (a === ses.id) acts = [10, 50, 100].map(n => `<button data-a=bid data-amt=${u.bid + n} ${me.money < u.bid + n ? 'disabled' : ''}>Bid $${u.bid + n}</button>`).join('') + '<button class=alt data-a=fold>Fold</button>';
    else hd += ` — ${nm(a)} to act`;
  } else {
    hd = mine ? 'Your turn' : esc(p.name) + "'s turn";
    if (mine && !busy()) {
      if (ph === 'roll') acts = p.jail ? `<button data-a=roll>Roll for doubles</button><button class=alt data-a=payJail>Pay $50</button>${p.jf ? '<button class=alt data-a=jailCard>Use jail card</button>' : ''}` : '<button data-a=roll>Roll dice</button>';
      if (ph === 'buy') acts = `<button data-a=buy ${me.money < B[p.pos].p ? 'disabled' : ''}>Buy ${B[p.pos].n} · $${B[p.pos].p}</button><button class=alt data-a=pass>${S.set.auction ? 'Auction it' : 'Pass'}</button>`;
      if (ph === 'end') acts = '<button data-a=end>End turn</button>';
      if (ph === 'debt') acts = `<button data-a=payDebt ${me.money < S.debt.amt ? 'disabled' : ''}>Pay $${S.debt.amt}</button><button class=alt data-a=bankrupt>Declare bankruptcy</button>`;
    }
  }
  $('#hd').innerHTML = hd; $('#acts').innerHTML = acts;
}
function openTrade() {
  const others = S.players.filter(p => p.id !== ses.id && !p.out); if (!others.length) return;
  const m = $('#tm'); m.style.display = 'flex';
  m.innerHTML = `<div class=mbox><h3 style="margin-top:0">Propose a trade</h3><label>Trade with <select id=tp>${others.map(p => `<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select></label>
    <div class=cols><div><b>You give</b><div id=tg></div></div><div><b>You get</b><div id=tt></div></div></div><div class=row><button id=ts>Send offer</button><button class=alt id=tx>Cancel</button></div></div>`;
  const list = (id, k) => `<label>Cash $<input type=number min=0 value=0 data-k=${k}></label>` + Object.keys(S.own).filter(i => S.own[i] === id).map(i => `<label><input type=checkbox data-k=${k} value=${i}>${B[i].n}${S.mort[i] ? ' (mortgaged)' : ''}</label>`).join('');
  const fill = () => { $('#tg').innerHTML = list(ses.id, 'g'); $('#tt').innerHTML = list($('#tp').value, 't'); };
  $('#tp').onchange = fill; fill(); $('#tx').onclick = () => m.style.display = 'none';
  $('#ts').onclick = async () => {
    const rd = k => ({ cash: +m.querySelector(`input[type=number][data-k=${k}]`).value || 0, props: [...m.querySelectorAll(`input[type=checkbox][data-k=${k}]:checked`)].map(x => +x.value) });
    const j = await send({ type: 'trade', to: $('#tp').value, give: rd('g'), get: rd('t') }); if (!j.err) m.style.display = 'none';
  };
}
if (ses && ses.host) { try { R = fix(JSON.parse(localStorage['mono-' + ses.code])); push(R); } catch { ses = null; render(); } }
else { if (ses) bc.postMessage({ k: 'sync', code: ses.code }); render(); }
</script></body></html>
